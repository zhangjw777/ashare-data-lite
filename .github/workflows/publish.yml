name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out release
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade build twine PyYAML

      - name: Check tag matches package version
        run: python -c "import os; from scripts.validate_release import project_version; assert os.environ['GITHUB_REF_NAME'] == 'v' + project_version()"

      - name: Build, inspect, install and test distributions
        run: python scripts/validate_release.py --dist-dir dist

      - name: Save verified distributions
        uses: actions/upload-artifact@v7.0.2
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/project/ashare-data-lite/
    permissions:
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@v8.0.2
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish using PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1

